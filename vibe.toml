# Root VIBE manifest for this repository.
# This file stores the active project-level VIBE configuration.
# Keep this file short and stable. Put detailed policy tuning into docs/vibe/*.toml.

# Root manifest metadata for the active VIBE configuration.
# Recommended: keep this section stable and change it only for manifest-level evolution.
[manifest]
# Schema version for vibe.toml itself, not the framework, product, or release version.
# Recommended: bump only for breaking manifest changes.
schema_version = "1"

# Semantic role of this file inside the VIBE configuration system.
# Recommended: keep as "root-active-config" for the canonical root manifest.
role = "root-active-config"

[project]
# Human-readable workspace name for this repository.
# Recommended: keep aligned with canonical identity surfaces.
name = "VIBE / vibestart"

# Short annotation used in status, onboarding, and generated surfaces.
# Recommended: describe the repository as a design and implementation workspace.
annotation = "Design workspace for the VIBE framework and the optional vibestart bootstrap/runtime product."

[bootstrap]
# Active vibestart bootstrap profile for this repository when the product layer is in scope.
# Allowed: "core" | "deep"
# Recommended: "core" while the methodology and product surface are still evolving.
profile = "core"

[execution]
# When true, plain engineering requests are routed through the VIBE macro layer
# as if the user had invoked the top-level `vibe` macro explicitly.
# Recommended: true
implicit_vibe = true

# Default autonomy mode for normal execution.
# Allowed: "guided" | "auto"
# Recommended: "guided" for framework and policy work.
autonomy = "guided"

# Default agent mode for normal execution.
# Allowed: "single" | "multi"
# Recommended: "single" until the plan shape and environment clearly support parallel work.
agents = "single"

[execution_policy]
# These values intentionally repeat the execution baseline so policy tooling can
# distinguish normative defaults from merely active local defaults.

# Normative framework default for autonomy.
# Recommended: "guided"
normative_autonomy = "guided"

# Normative framework default for agent count.
# Recommended: "single"
normative_agents = "single"

# Experimental but permitted surfaces while the deterministic kernel is still being hardened.
# Recommended: keep explicit to avoid silent autonomy inflation.
experimental = ["auto", "multi", "calibrate-apply"]

[capabilities]
# Primary memory surface for the project.
# Allowed: "xml" | "db"
# Recommended: "xml" for methodology-first work; switch to "db" only when long-lived memory is needed.
memory = "xml"

# Enables optional external integration surfaces.
# Recommended: false until the core framework surface is stable.
external_integrations = false

# Enables deployment planning as a first-class capability in the project.
# Recommended: true because deploy is part of the VIBE macro vocabulary.
deployment = true

# Enables policy calibration hooks inside the methodology.
# Recommended: true
calibration_hooks = true

[contracts]
# Detailed governance policy file.
# Recommended: keep the active project policy in docs/vibe/governance.toml.
governance_file = "docs/vibe/governance.toml"

# Detailed macro behavior file.
# Recommended: keep macro behavior and extension rules in docs/vibe/macros.toml.
macros_file = "docs/vibe/macros.toml"

[boundary]
# Future refactor note:
# If this section grows materially, consider splitting it into [boundary.paths]
# and [boundary.roles]. Keep it flat in v1 to avoid premature schema fragmentation.

# Canonical documentation root for VIBE project knowledge.
# Recommended: "docs"
canonical_docs_root = "docs"

# Root for detailed human-facing policy and macro configuration.
# Recommended: "docs/vibe"
policy_docs_root = "docs/vibe"

# Root for live runtime state, logs, and operational exhaust.
# Recommended: ".vibestart/state"
runtime_state_root = ".vibestart/state"

# Role of the root manifest in the configuration system.
# Recommended: "active-config"
root_manifest_role = "active-config"

# Role of the docs-level policy files.
# Recommended: "detailed-policy"
policy_docs_role = "detailed-policy"

# Role of the runtime state root.
# Recommended: "runtime-exhaust"
runtime_state_role = "runtime-exhaust"

# Whether runtime state is part of the canonical VIBE knowledge layer.
# Recommended: false
runtime_state_canonical = false

[overrides]
# Optional additional contract/config fragments, loaded after the primary policy files.
# Recommended: leave empty unless a repository-specific exception is truly needed.
override_files = []
